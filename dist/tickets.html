<body>

        <!-- Filters Section -->

        <!-- Action Buttons -->
        <div class="ticket-actions-header">
           <button class="btn btn-success" onclick="window.location.href='/new-ticket'" id="create-ticket-btn">

            <button class="btn btn-info" onclick="refreshTickets()">

        <!-- Tickets Table -->
        <div class="card">
            <div class="card-header">
                <h3>רשימת תקלות</h3>
            </div>
            <div class="card-body">
                <div class="table-container">
                    <table class="table" id="tickets-table">
                        <thead>
                            <tr>
                                <th>מספר תקלה</th>
                                <th>נושא התקלה</th>
                                <th>פיקוד</th>
                                <th>יחידה</th>
                                <th>עדיפות</th>
                                <th>סטטוס</th>
                                <th>תקלה חוזרת?</th>
                                <th>תיאור התקלה</th>
                                <th>תאריך פתיחה</th>
                                <th>פעולות</th>
                            </tr>
                        </thead>
                        <tbody id="tickets-table-body">
                            <tr>
                                <td colspan="9" class="text-center">
                                    <div class="loading">
                                        <div class="spinner"></div>
                                        <p>טוען תקלות...</p>
                                    </div>
                                </td>
                            </tr>

        <!-- Pagination -->

                <!-- Modal content will be populated by JavaScript -->

    <script src="/js/config.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/tickets.js"></script>
    <script src="/js/utils.js"></script>
    
    
<script>
    // Global variables for pagination and filtering
    let currentPage = 1;
    let currentFilters = {};

    // Load tickets function - THE MISSING FUNCTION
    async function loadTickets(page = 1, filters = {}) {
        try {
            console.log('🔄 Loading tickets...', { page, filters });
            
            // Show loading spinner
            const tableBody = document.getElementById('tickets-table-body');
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center">
                        <div class="loading">
                            <div class="spinner"></div>
                            <p>טוען תקלות...</p>
                        </div>
                    </td>
                </tr>
            `;

            // Build query parameters
            const params = new URLSearchParams({
                page: page,
                limit: 20,
                ...filters
            });

            // Fetch tickets from backend
            const response = await fetch(`${window.API_BASE_URL}/tickets?${params}`, {
                method: 'GET',
                credentials: 'include',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }

            const result = await response.json();
            
            if (!result.success) {
                throw new Error(result.message || 'Failed to load tickets');
            }

            console.log('✅ Tickets loaded:', result.data);

            // Update global state
            currentPage = page;
            currentFilters = filters;

            // Render tickets
            renderTickets(result.data.tickets || []);

            // Update pagination if provided
            if (result.data.pagination) {
                renderPagination(result.data.pagination);
            }

        } catch (error) {
            console.error('❌ Error loading tickets:', error);
            showTicketsError('שגיאה בטעינת התקלות: ' + error.message);
        }
    }

    // Render tickets in table
    function renderTickets(tickets) {
        const tableBody = document.getElementById('tickets-table-body');
        
        if (!tickets || tickets.length === 0) {
            tableBody.innerHTML = `
                <tr>
                    <td colspan="9" class="text-center">אין תקלות להצגה</td>
                </tr>
            `;
            return;
        }

        tableBody.innerHTML = tickets.map(ticket => `
            <tr>
                <td>${ticket.ticketNumber || ''}</td>
                <td>${ticket.subject || '-'}</td>
                <td>${ticket.command || ''}</td>
                <td>${ticket.unit || ''}</td>
                <td><span class="priority-${(ticket.priority || '').toLowerCase()}">${ticket.priority || ''}</span></td>
                <td><span class="status-${(ticket.status || '').toLowerCase()}">${ticket.status || ''}</span></td>
                <td>${ticket.isRecurring ? 'כן' : 'לא'}</td>
                <td class="ticket-description" title="${ticket.description || ''}">${ticket.description || ''}</td>
                <td>${formatDate(ticket.openDate)}</td>
                <td class="ticket-actions">
                    <button class="btn btn-sm btn-info" onclick="viewTicket('${ticket._id}')">צפייה</button>
                    ${(currentUser?.role === 'admin' || currentUser?.role === 'technician') ? 
                        `<button class="btn btn-sm btn-warning" onclick="editTicket('${ticket._id}')">עריכה</button>` : ''}
                </td>
            </tr>
        `).join('');
    }

    // Show error in tickets table
    function showTicketsError(message) {
        const tableBody = document.getElementById('tickets-table-body');
        tableBody.innerHTML = `
            <tr>
                <td colspan="9" class="text-center" style="color: #ef4444;">
                    ${message}
                    <br><br>
                    <button class="btn btn-info" onclick="loadTickets()">נסה שוב</button>
                </td>
            </tr>
        `;
    }

    // Format date helper
    function formatDate(dateString) {
        if (!dateString) return '';
        try {
            return new Date(dateString).toLocaleDateString('he-IL');
        } catch {
            return dateString;
        }
    }

    // Refresh tickets function
    function refreshTickets() {
        console.log('🔄 Refreshing tickets...');
        loadTickets(currentPage, currentFilters);
    }

    // Handle URL parameters for specific actions
    document.addEventListener('DOMContentLoaded', () => {
        // Load tickets automatically when page loads
        loadTickets();

        // Handle URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const action = urlParams.get('action');
        const viewTicketId = urlParams.get('view');
        
        if (action === 'create' && (currentUser?.role === 'admin' || currentUser?.role === 'technician')) {
            setTimeout(() => showCreateTicketForm(), 1000);
        }
        
        if (viewTicketId) {
            setTimeout(() => viewTicket(viewTicketId), 1000);
        }
    });

    // Placeholder functions (implement these if needed)
    function renderPagination(pagination) {
        console.log('Pagination:', pagination);
        // TODO: Implement pagination rendering
    }

    function viewTicket(ticketId) {
        console.log('View ticket:', ticketId);
        // TODO: Implement ticket viewing
    }

    function editTicket(ticketId) {
        console.log('Edit ticket:', ticketId);
        // TODO: Implement ticket editing
    }

    function showCreateTicketForm() {
        console.log('Show create ticket form');
        // TODO: Implement create ticket form
    }
</script>
